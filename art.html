<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Artwork Gallery of José Fernando Mendes — Fine Arts, SciArt, Oil and Pastel paintings.">
    <title>Artwork — José Fernando Mendes</title>
    
    <!-- Favicon -->
    <link rel="shortcut icon" href="logo.jpg?v=2" type="image/jpeg">
    <link rel="icon" href="logo.jpg?v=2" type="image/jpeg">
    
    <!-- Google Fonts typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">

    <!-- External Stylesheet -->
    <link rel="stylesheet" href="styles.css">

    <style>
        :root {
            --primary: #102a43;
            --secondary: #0b69a3;
            --text-dark: #121212;
            --text-muted: #71717a;
            --bg-light: #ffffff;
            --border-subtle: #f0f0f0;
        }

        body {
            background-color: #ffffff;
            color: var(--text-dark);
            font-family: "Inter", sans-serif;
            font-weight: 300;
            line-height: 1.6;
        }

        /* -------------------------------------------------------------
           Header & Nav
           ------------------------------------------------------------- */
        .site-header {
            background: #ffffff;
            border-bottom: 1px solid #ededed;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-brand {
            display: grid;
            grid-template-columns: auto 1fr;
            grid-template-rows: auto auto;
            column-gap: 0.85rem;
            align-items: center;
        }

        .nav-brand::before {
            content: "";
            grid-column: 1;
            grid-row: 1 / span 2;
            display: block;
            width: 42px;
            height: 42px;
            background-image: url('logo.jpg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .nav-brand h1 {
            grid-column: 2;
            grid-row: 1;
            font-family: "Newsreader", Georgia, serif;
            font-size: 1.45rem;
            font-weight: 400;
            letter-spacing: -0.01em;
            line-height: 1.15;
            margin: 0;
        }

        .nav-brand h1 a {
            text-decoration: none;
            color: inherit;
        }

        .nav-subtitle {
            grid-column: 2;
            grid-row: 2;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.02em;
            margin-top: 2px;
            line-height: 1.2;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 1.5rem;
            align-items: center;
        }

        .nav-item-dropdown {
            position: relative;
        }

        .nav-link {
            text-decoration: none;
            color: #333333;
            font-size: 0.9rem;
            letter-spacing: 0.02em;
            padding: 0.4rem 0;
            transition: opacity 0.2s;
        }

        .nav-link:hover, .nav-link.active {
            color: #000000;
            border-bottom: 1px solid #000000;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: #ffffff;
            border: 1px solid #ededed;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            min-width: 220px;
            list-style: none;
            padding: 0.6rem 0;
            z-index: 110;
        }

        .nav-item-dropdown:hover .dropdown-menu {
            display: block;
        }

        .dropdown-menu li a {
            display: block;
            padding: 0.45rem 1.4rem;
            color: #444;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .dropdown-menu li a:hover {
            color: #000000;
            background: #fafafa;
        }

        /* -------------------------------------------------------------
           Main Container & Joan Mitchell Style Controls
           ------------------------------------------------------------- */
        .gallery-wrap {
            max-width: 1320px;
            margin: 0 auto;
            padding: 4rem 2.5rem 6rem;
        }

        .gallery-intro {
            margin-bottom: 3.5rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 1.5rem;
            border-bottom: 1px solid #eaeaea;
            padding-bottom: 1.8rem;
        }

        .gallery-intro h2 {
            font-family: "Newsreader", Georgia, serif;
            font-size: 2.8rem;
            font-weight: 300;
            letter-spacing: -0.02em;
            color: #111111;
        }

        .filter-nav {
            display: flex;
            gap: 1.8rem;
        }

        .filter-btn {
            background: none;
            border: none;
            padding: 0.2rem 0;
            font-family: "Inter", sans-serif;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #888888;
            cursor: pointer;
            position: relative;
            transition: color 0.2s ease;
        }

        .filter-btn:hover {
            color: #111111;
        }

        .filter-btn.active {
            color: #111111;
            font-weight: 500;
        }

        .filter-btn.active::after {
            content: "";
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 100%;
            height: 1px;
            background: #111111;
        }

        /* -------------------------------------------------------------
           Artwork Grid (Joan Mitchell Foundation inspired)
           ------------------------------------------------------------- */
        .artwork-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            column-gap: 3.5rem;
            row-gap: 4.5rem;
            margin-bottom: 4rem;
        }

        .artwork-item {
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }

        .artwork-item:hover {
            opacity: 0.82;
        }

        .artwork-frame {
            width: 100%;
            height: 380px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fafafa;
            margin-bottom: 1.2rem;
            padding: 1rem;
        }

        .artwork-frame img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            box-shadow: 0 4px 18px rgba(0,0,0,0.04);
        }

        .artwork-caption {
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }

        .artwork-title {
            font-family: "Newsreader", Georgia, serif;
            font-size: 1.35rem;
            font-weight: 400;
            font-style: italic;
            color: #111111;
            line-height: 1.25;
        }

        .artwork-meta {
            font-family: "Inter", sans-serif;
            font-size: 0.82rem;
            color: #71717a;
            font-weight: 300;
            margin-top: 0.15rem;
        }

        /* -------------------------------------------------------------
           Pagination Controls
           ------------------------------------------------------------- */
        .pagination-bar {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            padding-top: 2rem;
            border-top: 1px solid #f0f0f0;
        }

        .pagination-links {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .page-link-btn {
            background: none;
            border: 1px solid transparent;
            font-family: "Inter", sans-serif;
            font-size: 0.88rem;
            padding: 0.4rem 0.8rem;
            cursor: pointer;
            color: #555555;
            transition: all 0.2s;
        }

        .page-link-btn:hover:not(:disabled) {
            color: #000000;
            border-color: #cccccc;
        }

        .page-link-btn.active {
            color: #000000;
            font-weight: 500;
            border-color: #000000;
        }

        .page-link-btn:disabled {
            opacity: 0.3;
            cursor: default;
        }

        .page-summary {
            font-size: 0.8rem;
            color: #999999;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        footer {
            text-align: center;
            padding: 3rem 1rem;
            color: #a1a1aa;
            font-size: 0.8rem;
            border-top: 1px solid #ededed;
        }

        @media (max-width: 1024px) {
            .artwork-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 2.5rem;
            }
        }

        @media (max-width: 640px) {
            .artwork-grid {
                grid-template-columns: 1fr;
            }
            .artwork-frame {
                height: 300px;
            }
            .gallery-wrap {
                padding: 2.5rem 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Header / Navigation -->
    <header class="site-header">
        <nav class="nav-container">
            <div class="nav-brand">
                <h1><a href="index.html">José Fernando Mendes</a></h1>
                <p class="nav-subtitle">Professor of Physics and Artist</p>
            </div>

            <ul class="nav-menu">
                <li><a href="index.html" class="nav-link">Home</a></li>
                <li class="nav-item-dropdown">
                    <a href="research.html" class="nav-link">Research</a>
                    <ul class="dropdown-menu">
                        <li><a href="research.html#stats">Overview &amp; Stats</a></li>
                        <li><a href="research.html#publications">Publications</a></li>
                    </ul>
                </li>
                <li><a href="teaching.html" class="nav-link">Teaching</a></li>
                <li class="nav-item-dropdown">
                    <a href="art.html" class="nav-link active">Art</a>
                    <ul class="dropdown-menu">
                        <li><a href="art.html?medium=oil">Oil painting</a></li>
                        <li><a href="art.html?medium=pastel">Pastel painting</a></li>
                    </ul>
                </li>
                <li><a href="about.html" class="nav-link">About Me</a></li>
                <li><a href="cv.html" class="nav-link">CV</a></li>
                <li><a href="mailto:jfmendes@ua.pt" class="nav-link">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="gallery-wrap">
        <section class="gallery-intro">
            <div>
                <h2>Artwork</h2>
            </div>
            
            <div class="filter-nav">
                <button class="filter-btn active" data-filter="all">All Works</button>
                <button class="filter-btn" data-filter="oil">Oil</button>
                <button class="filter-btn" data-filter="pastel">Pastel</button>
            </div>
        </section>

        <!-- Dynamic Grid -->
        <div class="artwork-grid" id="artworkGrid"></div>

        <!-- Pagination Controls -->
        <div class="pagination-bar">
            <div class="pagination-links" id="paginationLinks"></div>
            <div class="page-summary" id="pageSummary"></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 José Fernando Mendes | University of Aveiro</p>
    </footer>

    <!-- Shared Artworks Database & Presentation Script -->
    <script src="artworks-data.js"></script>
    <script>
        const ITEMS_PER_PAGE = 9;
        let currentFilter = 'all';
        let currentPage = 1;

        // Suporte para URL ex: art.html?medium=oil
        const urlParams = new URLSearchParams(window.location.search);
        const mediumParam = urlParams.get('medium');
        if (mediumParam && (mediumParam === 'oil' || mediumParam === 'pastel')) {
            currentFilter = mediumParam;
        }

        const grid = document.getElementById('artworkGrid');
        const paginationLinks = document.getElementById('paginationLinks');
        const pageSummary = document.getElementById('pageSummary');
        const filterBtns = document.querySelectorAll('.filter-btn');

        function renderGallery() {
            const filtered = artworksData.filter(item => {
                if (currentFilter === 'all') return true;
                return item.medium === currentFilter;
            });

            const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE) || 1;
            if (currentPage > totalPages) currentPage = 1;

            const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
            const currentItems = filtered.slice(startIndex, startIndex + ITEMS_PER_PAGE);

            grid.innerHTML = '';
            if (currentItems.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #999; padding: 4rem 0;">No artworks available in this category.</p>';
            } else {
                currentItems.forEach(art => {
                    const item = document.createElement('a');
                    item.className = 'artwork-item';
                    item.href = `artwork-detail.html?id=${art.id}`;
                    item.innerHTML = `
                        <div class="artwork-frame">
                            <img src="${art.src}" alt="${art.title}" onerror="this.onerror=null; this.src='${art.fallback}';">
                        </div>
                        <div class="artwork-caption">
                            <div class="artwork-title">${art.title}</div>
                            <div class="artwork-meta">${art.year} &middot; ${art.mediumLabel}</div>
                        </div>
                    `;
                    grid.appendChild(item);
                });
            }

            renderPagination(totalPages, filtered.length, startIndex, startIndex + currentItems.length);
        }

        function renderPagination(totalPages, totalItems, start, end) {
            paginationLinks.innerHTML = '';
            pageSummary.innerHTML = '';

            if (totalItems === 0) return;

            pageSummary.textContent = `${start + 1}–${end} of ${totalItems} Works &middot; Page ${currentPage} of ${totalPages}`;

            if (totalPages <= 1) return;

            // Botão Prev
            const prev = document.createElement('button');
            prev.className = 'page-link-btn';
            prev.textContent = '← Prev';
            prev.disabled = (currentPage === 1);
            prev.onclick = () => {
                currentPage--;
                renderGallery();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };
            paginationLinks.appendChild(prev);

            // Páginas 1, 2...
            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = `page-link-btn ${i === currentPage ? 'active' : ''}`;
                btn.textContent = i;
                btn.onclick = () => {
                    currentPage = i;
                    renderGallery();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                };
                paginationLinks.appendChild(btn);
            }

            // Botão Next
            const next = document.createElement('button');
            next.className = 'page-link-btn';
            next.textContent = 'Next →';
            next.disabled = (currentPage === totalPages);
            next.onclick = () => {
                currentPage++;
                renderGallery();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };
            paginationLinks.appendChild(next);
        }

        // Filtros
        filterBtns.forEach(btn => {
            const val = btn.getAttribute('data-filter');
            if (val === currentFilter) btn.classList.add('active');
            else btn.classList.remove('active');

            btn.onclick = () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = val;
                currentPage = 1;
                renderGallery();
            };
        });

        renderGallery();
    </script>
</body>
</html>
